<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>穿越文明 · 放置挂机</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--border:#e8ddcf;--gold:#c9a227;--brown:#8b5e3c;--text:#4a3b2e;--sub:#a08c77;--green:#16a34a;--red:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px 40px}
.header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:8px}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#c9a227,#8b5e3c);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.version{font-size:11px;color:var(--sub);background:var(--card);padding:4px 10px;border-radius:20px;border:1px solid var(--border)}

.era-banner{background:linear-gradient(135deg,#8b5e3c,#c9a227);color:#fff;border-radius:16px;padding:20px 18px;margin:10px 0 14px;text-align:center;position:relative;overflow:hidden}
.era-banner::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(255,255,255,.08);border-radius:50%}
.era-banner::before{content:'';position:absolute;bottom:-30px;left:-10px;width:100px;height:100px;background:rgba(255,255,255,.05);border-radius:50%}
.era-name{font-size:26px;font-weight:800;letter-spacing:2px}
.era-sub{font-size:12px;opacity:.85;margin-top:4px}
.era-icon{font-size:34px;margin-bottom:4px}

.resources{display:flex;gap:10px;margin-bottom:14px}
.res-card{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.res-card .val{font-size:22px;font-weight:800;color:var(--gold)}
.res-card .val.green{color:var(--green)}
.res-card .label{font-size:11px;color:var(--sub);margin-top:3px}

.main-btn{width:100%;padding:22px;border:none;border-radius:16px;background:linear-gradient(135deg,#c9a227,#b8860b);color:#fff;font-size:20px;font-weight:800;cursor:pointer;margin-bottom:14px;transition:transform .1s;box-shadow:0 4px 12px rgba(201,162,39,.3)}
.main-btn:active{transform:scale(.97)}
.main-btn .sub{font-size:13px;font-weight:500;opacity:.9;margin-top:4px}

.section-title{font-size:14px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.upgrade-list{display:flex;flex-direction:column;gap:8px}
.upgrade{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.upgrade .info{flex:1}
.upgrade .name{font-size:15px;font-weight:700}
.upgrade .desc{font-size:12px;color:var(--sub);margin-top:2px}
.upgrade .level{font-size:11px;color:var(--gold);font-weight:600}
.buy-btn{padding:10px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,#c9a227,#b8860b);color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.buy-btn:disabled{background:#d8cdb8;cursor:not-allowed}
.buy-btn .price{font-size:11px;opacity:.9}

.era-track{margin-top:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.era-track .title{font-size:12px;color:var(--sub);margin-bottom:8px}
.era-list{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:none}
.era-list::-webkit-scrollbar{display:none}
.era-dot{flex-shrink:0;width:52px;padding:8px 4px;border-radius:10px;text-align:center;font-size:10px;background:#f5efe6;border:1px solid var(--border);color:var(--sub)}
.era-dot.current{background:linear-gradient(135deg,#c9a227,#b8860b);color:#fff;border-color:transparent;font-weight:700}
.era-dot.passed{color:var(--green)}
.era-dot .ic{font-size:18px;display:block;margin-bottom:2px}

.progress{margin-top:10px;height:8px;background:#f0e9de;border-radius:4px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#c9a227,#b8860b);border-radius:4px;transition:width .3s}
.progress-label{font-size:11px;color:var(--sub);margin-top:5px;text-align:center}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(74,59,46,.9);color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.toast.gold{background:rgba(201,162,39,.95)}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🏺</div>
    <span>穿越文明</span>
  </div>
  <span class="version" id="saveVersion">v0.1</span>
</div>

<div class="era-banner" id="eraBanner">
  <div class="era-icon" id="eraIcon">🪨</div>
  <div class="era-name" id="eraName">石器时代</div>
  <div class="era-sub" id="eraSub">钻木取火 · 万物起源</div>
</div>

<div class="resources">
  <div class="res-card">
    <div class="val" id="coinVal">0</div>
    <div class="label">💰 金币</div>
  </div>
  <div class="res-card">
    <div class="val green" id="rateVal">0/秒</div>
    <div class="label">📈 产出速率</div>
  </div>
  <div class="res-card">
    <div class="val" id="offlineVal">0</div>
    <div class="label">🌙 离线收益</div>
  </div>
</div>

<button class="main-btn" id="tapBtn" onclick="tap()">
  🪵 采集木柴
  <div class="sub">+1 金币</div>
</button>

<div class="section-title">⚒️ 升级文明</div>
<div class="upgrade-list" id="upgradeList"></div>

<div class="era-track">
  <div class="title">🗺️ 文明之路</div>
  <div class="era-list" id="eraList"></div>
  <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel"></div>
</div>

<script>
// ============ 游戏数据 ============
const SAVE_KEY = 'civilization_save_v1';

const ERAS = [
  {name:'石器时代',icon:'🪨',sub:'钻木取火 · 万物起源',need:0},
  {name:'青铜时代',icon:'🏹',sub:'铜器初现 · 部落联盟',need:1000},
  {name:'商周',icon:'🥁',sub:'礼乐初成 · 甲骨记事',need:5000},
  {name:'春秋战国',icon:'⚔️',sub:'百家争鸣 · 群雄并起',need:20000},
  {name:'秦汉',icon:'🏯',sub:'一统天下 · 长城万里',need:80000},
  {name:'三国魏晋',icon:'🐴',sub:'三分天下 · 乱世英雄',need:250000},
  {name:'隋唐',icon:'🏮',sub:'盛世长安 · 万邦来朝',need:800000},
  {name:'宋元',icon:'⚓',sub:'市井繁华 · 海上丝路',need:2500000},
  {name:'明清',icon:'🏺',sub:'紫禁巍峨 · 康乾盛世',need:8000000},
  {name:'近现代',icon:'🚂',sub:'工业革命 · 时代巨变',need:25000000},
  {name:'未来',icon:'🚀',sub:'星辰大海 · 无限可能',need:100000000},
];

// 升级项：basePrice基础价，priceMul价格倍率，effect每级效果
const UPGRADES = [
  {id:'axe',name:'🪓 磨利石斧',desc:'采集效率 +20%',basePrice:15,priceMul:1.5,effect:0.2},
  {id:'fire',name:'🔥 火种技术',desc:'文明薪火 +25%',basePrice:120,priceMul:1.6,effect:0.25},
  {id:'farm',name:'🌾 开垦农田',desc:'粮食收成 +30%',basePrice:800,priceMul:1.7,effect:0.3},
  {id:'craft',name:'🏺 陶器作坊',desc:'制陶技艺 +35%',basePrice:5000,priceMul:1.75,effect:0.35},
  {id:'trade',name:'🛶 贸易商路',desc:'商路收益 +40%',basePrice:30000,priceMul:1.8,effect:0.4},
  {id:'wheel',name:'⚙️ 轮子发明',desc:'运输效率 +50%',basePrice:150000,priceMul:1.85,effect:0.5},
  {id:'coin',name:'🪙 铸造货币',desc:'经济体系 +60%',basePrice:700000,priceMul:1.9,effect:0.6},
  {id:'iron',name:'⚒️ 冶铁技术',desc:'铁器时代 +75%',basePrice:3000000,priceMul:1.95,effect:0.75},
];

let game = {
  coins: 0,
  totalEarned: 0,
  taps: 0,
  levels: {},
  lastTime: Date.now(),
  startedAt: Date.now(),
};

// ============ 存档 ============
function save(){
  game.lastTime = Date.now();
  localStorage.setItem(SAVE_KEY, JSON.stringify(game));
}

function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      // 离线收益计算
      const elapsed = (Date.now() - data.lastTime) / 1000;
      const rate = calcRate(data);
      const offline = Math.floor(elapsed * rate * 0.5); // 离线只有50%效率
      if(offline > 0){
        data.coins += offline;
        data.totalEarned += offline;
        game.offlineGain = offline;
      }
      game = Object.assign(game, data);
    }
  }catch(e){ console.log('load err', e); }
}

// ============ 产出计算 ============
function calcRate(g = game){
  let rate = 1;
  UPGRADES.forEach(u=>{
    const lv = g.levels[u.id] || 0;
    rate *= (1 + u.effect * lv);
  });
  return rate;
}

function getUpgradePrice(u, lv){
  return Math.floor(u.basePrice * Math.pow(u.priceMul, lv));
}

// ============ 主循环 ============
function tick(){
  const now = Date.now();
  const dt = (now - game.lastTime) / 1000;
  game.lastTime = now;
  
  const rate = calcRate();
  const gain = rate * dt;
  game.coins += gain;
  game.totalEarned += gain;
  updateUI();
  save();
}

function tap(){
  const rate = calcRate();
  const gain = rate;
  game.coins += gain;
  game.totalEarned += gain;
  game.taps++;
  showTapFx();
  updateUI();
}

// ============ UI ============
function fmt(n){
  if(n >= 1e9) return (n/1e9).toFixed(2)+'亿';
  if(n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if(n >= 1e4) return (n/1e3).toFixed(1)+'K';
  return Math.floor(n).toLocaleString();
}

function currentEra(){
  let idx = 0;
  ERAS.forEach((e,i)=>{ if(game.totalEarned >= e.need) idx = i; });
  return idx;
}

function updateUI(){
  // 资源
  document.getElementById('coinVal').textContent = fmt(game.coins);
  document.getElementById('rateVal').textContent = fmt(calcRate())+'/秒';
  document.getElementById('offlineVal').textContent = game.offlineGain ? fmt(game.offlineGain) : '0';
  
  // 朝代
  const idx = currentEra();
  const era = ERAS[idx];
  document.getElementById('eraIcon').textContent = era.icon;
  document.getElementById('eraName').textContent = era.name;
  document.getElementById('eraSub').textContent = era.sub;
  
  // 朝代列表
  const eraList = document.getElementById('eraList');
  eraList.innerHTML = ERAS.map((e,i)=>{
    const cls = i < idx ? 'passed' : (i === idx ? 'current' : '');
    return `<div class="era-dot ${cls}"><span class="ic">${e.icon}</span>${e.name}</div>`;
  }).join('');
  const list = document.getElementById('eraList');
  list.scrollLeft = list.scrollWidth;
  
  // 进度条
  const next = ERAS[idx+1];
  if(next){
    const total = next.need - era.need;
    const cur = game.totalEarned - era.need;
    const pct = Math.min(100, Math.max(0, cur/total*100));
    document.getElementById('progressBar').style.width = pct+'%';
    document.getElementById('progressLabel').textContent = `距${next.name}还需 ${fmt(next.need - game.totalEarned)}`;
  } else {
    document.getElementById('progressBar').style.width = '100%';
    document.getElementById('progressLabel').textContent = '已抵达文明之巅';
  }
  
  // 升级列表
  const ul = document.getElementById('upgradeList');
  ul.innerHTML = UPGRADES.map(u=>{
    const lv = game.levels[u.id] || 0;
    const price = getUpgradePrice(u, lv);
    const canBuy = game.coins >= price;
    return `<div class="upgrade">
      <div class="info">
        <div class="name">${u.name} <span class="level">Lv.${lv}</span></div>
        <div class="desc">${u.desc}（当前 +${Math.floor(lv*u.effect*100)}%）</div>
      </div>
      <button class="buy-btn" ${canBuy?'':'disabled'} onclick="buy('${u.id}')">
        升级 <span class="price">${fmt(price)}</span>
      </button>
    </div>`;
  }).join('');
}

function buy(id){
  const u = UPGRADES.find(x=>x.id===id);
  const lv = game.levels[id] || 0;
  const price = getUpgradePrice(u, lv);
  if(game.coins >= price){
    game.coins -= price;
    game.levels[id] = lv + 1;
    showToast(`⚒️ ${u.name} 升至 Lv.${lv+1}！`, true);
    updateUI();
    save();
  }
}

// ============ 特效 ============
function showTapFx(){
  const btn = document.getElementById('tapBtn');
  btn.style.transform = 'scale(.95)';
  setTimeout(()=>btn.style.transform = 'scale(1)', 80);
}

function showToast(msg, gold){
  let el = document.querySelector('.toast');
  if(!el){
    el = document.createElement('div');
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.toggle('gold', !!gold);
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.remove('show'), 1800);
}

// ============ 启动 ============
load();
if(game.offlineGain > 0){
  showToast(`🌙 离线 ${Math.floor((Date.now()-game.lastTime)/3600000*10)/10} 小时，收获 ${fmt(game.offlineGain)} 金币`, true);
}
updateUI();
setInterval(tick, 250);
</script>
</body>
</html>
