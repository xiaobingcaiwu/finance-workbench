<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>盐选找书助手</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--border:#e8e3db;--cyan:#0d9488;--text:#3d3835;--sub:#8c8580}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding:20px 16px}
h1{font-size:20px;margin-bottom:6px}
.sub{font-size:13px;color:var(--sub);margin-bottom:20px}
input{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;font-size:16px;outline:none;margin-bottom:12px}
input:focus{border-color:var(--cyan)}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;margin-bottom:8px;text-decoration:none}
.btn-c{background:var(--cyan);color:#fff}
.btn-w{background:var(--card);color:var(--text);border:1px solid var(--border)}
.links{margin-top:16px}
.link-card{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--text)}
.link-card .name{font-size:14px;font-weight:500}
.link-card .arrow{color:var(--sub)}
.tip{font-size:12px;color:var(--sub);margin-top:20px;line-height:1.8;background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--border)}
</style>
</head>
<body>
<h1>📚 盐选找书助手</h1>
<div class="sub">输入书名，一键跳转搜索</div>

<input type="text" id="bookName" placeholder="输入书名关键词，如：空调对着后颈吹">

<button class="btn btn-c" onclick="search()">🔍 搜索</button>

<div class="links" id="links"></div>

<div class="tip">
💡 <b>找书技巧</b><br>
1. 重点用<b>「百度搜转载站」</b>和<b>「排除知乎原站」</b>，搜出来的搬运站不用会员<br>
2. 搜不到换关键词重试——有些盐选专栏改过名<br>
3. 公众号文章有时候会全文转载，搜狗那条专门搜这个
</div>

<script>
function search(){
  const name=document.getElementById('bookName').value.trim();
  if(!name)return;
  const q=encodeURIComponent('知乎盐选 '+name+' 全文');
  const q2=encodeURIComponent('知乎盐选 '+name+' -site:zhihu.com');
  const engines=[
    {name:'🔍 百度搜转载站',url:'https://www.baidu.com/s?wd='+q},
    {name:'🔍 百度(排除知乎原站)',url:'https://www.baidu.com/s?wd='+q2},
    {name:'🔍 搜狗搜公众号',url:'https://weixin.sogou.com/weixin?type=2&query='+encodeURIComponent('知乎盐选 '+name)},
    {name:'📖 必应搜索',url:'https://cn.bing.com/search?q='+q},
  ];
  let html='';
  engines.forEach(e=>{
    html+=`<a class="link-card" href="${e.url}" target="_blank"><span class="name">${e.name}</span><span class="arrow">→</span></a>`;
  });
  document.getElementById('links').innerHTML=html;
}
</script>
</body>
</html>
